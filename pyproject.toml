[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ptgp"
authors = [
    {name = 'Bill Engels', email = 'w.j.engels@gmail.com'},
    {name = 'PyMC Developers', email = 'pymc.devs@gmail.com'}
]
description = "A practitioner's toolbox for estimating large-scale Gaussian Process models with PyMC and PyTensor"
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "gaussian processes",
    "bayesian",
    "variational inference",
    "probabilistic programming",
    "pymc",
    "pytensor",
]
license = {file = "LICENSE"}
dynamic = ["version"]
dependencies = [
  "numpy",
  "pymc>=6.3,<6.4",
  "pytensor>=3.3.4,<3.4",
  "pytensor-ml>=0.3.0,<0.4.0"
]

[project.optional-dependencies]
dev = ["pytest", "pre-commit", "mypy", "polars"]

[project.urls]
Repository = "https://github.com/pymc-devs/ptgp.git"
Issues = "https://github.com/pymc-devs/ptgp/issues"

[tool.hatch.version]
source = 'vcs'

[tool.hatch.build.hooks.vcs]
version-file = "ptgp/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
  '/.github',
  '/notebooks',
  '/pixi.lock',
]

[tool.hatch.build.targets.wheel]
packages = ["ptgp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
minversion = "6.0"
xfail_strict = true
addopts = [
  "-v",
  "--doctest-modules",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["D", "E", "F", "I", "UP", "W", "RUF"]
ignore = [
  "E501",
  "RUF001", # String contains ambiguous character (such as Greek letters)
  "RUF002", # Docstring contains ambiguous character (such as Greek letters)
  "RUF003", # Comment contains ambiguous character (such as Greek letters)
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
  "D200",
  "D202",
  "D203",
  "D204",
  "D205",
  "D209",
  "D212",
  "D213",
  "D301",
  "D400",
  "D401",
  "D403",
  "D413",
  "D415",
  "D417",
]

[tool.ruff.lint.isort]
lines-between-types = 1

[tool.ruff.lint.per-file-ignores]
# Notebooks are hand-formatted for teaching; don't reorganize their imports.
"*.ipynb" = ["I001", "E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
files = ["ptgp"]

# -- pixi --------------------------------------------------------------------
# `pixi install` builds the full dev env (runtime + tests + notebooks + docs);
# `pixi run test` / `pixi run lint` / `pixi run docs` etc. run the tasks below.
# conda_envs/*.yaml are the conda equivalents (dev / CI / Read the Docs); keep the
# pins here in sync with them.

[tool.pixi.workspace]
channels = ["conda-forge"]
# mlx (PyTensor's MLX backend, Apple silicon only) needs macOS >= 14.5.
platforms = [
  { name = "apple-silicon", platform = "osx-arm64", macos = "14.5" },
  "linux-64",
  "win-64",
]

# Runtime stack from conda-forge: the [project] dependencies above plus
# PyTensor's optional JIT backends (numba, jax; mlx on Apple silicon).
[tool.pixi.dependencies]
python = ">=3.12"
numpy = "*"
pymc = ">=6.3,<6.4"
pytensor = ">=3.3,<3.4"
pytensor-ml = ">=0.3.0,<0.4.0"
numba = "*"

[tool.pixi.target.osx-arm64.dependencies]
mlx = "*"

[tool.pixi.pypi-dependencies]
ptgp = { path = ".", editable = true }

# Everything the CI style / test / mypy jobs need.
[tool.pixi.feature.test.dependencies]
pytest = "*"
mypy = "*"
polars = "*"
pre-commit = "*"

# ruff comes from PyPI: the conda-forge build of 0.5.5 pins python<3.13.
[tool.pixi.feature.test.pypi-dependencies]
ruff = "==0.5.5"  # keep in sync with .pre-commit-config.yaml

# Interactive work: Jupyter plus what the notebooks import, and jax for
# PyTensor's JAX backend. conda-forge has no jaxlib for win-64, so this feature
# (and the default env) is mac/linux only; `test` and `docs` still solve on Windows.
[tool.pixi.feature.notebook]
platforms = ["apple-silicon", "linux-64"]

[tool.pixi.feature.notebook.dependencies]
jupyterlab = "*"
matplotlib = "*"
pandas = "*"
scikit-learn = "*"
jax = "*"
jaxlib = "*"

# Sphinx build, kept in sync with conda_envs/environment-docs.yaml.
[tool.pixi.feature.docs.dependencies]
matplotlib = "*"  # docs/sphinxext/generate_kernel_gallery.py
sphinx = ">=7"
pydata-sphinx-theme = "*"
myst-nb = "*"
numpydoc = "*"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinx-codeautolink = "*"
sphinx-sitemap = "*"
sphinx-notfound-page = "*"
sphinx-autobuild = "*"
jupyter-sphinx = "*"
pybtex = "*"

[tool.pixi.environments]
default = { features = ["test", "notebook", "docs"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[tool.pixi.tasks]
test = "python -m pytest tests/"
cubic-floor = "python -m pytest tests/test_cubic_floor.py"
lint = "ruff check ptgp/ tests/"
format = "ruff format ptgp/ tests/"
mypy = "python scripts/run_mypy.py --verbose"
hooks = "pre-commit run --all-files"
docs = { cmd = "make html", cwd = "docs" }
docs-live = { cmd = "make livehtml", cwd = "docs" }
# Register this env as a Jupyter kernel named "ptgp" so notebooks opened from
# any Jupyter / VS Code can use it.
kernel = 'python -m ipykernel install --user --name ptgp --display-name "Python (ptgp)"'
