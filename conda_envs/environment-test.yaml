name: ptgp-test
channels:
    - conda-forge
dependencies:
    - python>=3.12
    - numpy
    - pymc>=6.3,<6.4
    - pytensor>=3.3,<3.4
    - pytest
    - mypy
    - polars
    # scipy 1.18.1 renames the fused cython_special symbols pytensor's numba
    # dispatch looks up (KeyError on psi); hold back until pytensor adapts.
    - scipy<1.18.1
    - filelock
    - numba
    - setuptools
    - cons
    - etuples
    - logical-unification
    - minikanren
    - arviz
    - cachetools
    - cloudpickle
    - pandas
    - rich
    - threadpoolctl
    - typing_extensions
    - pip
