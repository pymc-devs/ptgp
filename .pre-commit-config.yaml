ci:
  autofix_prs: false

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
    -   id: check-merge-conflict
    -   id: check-toml
    -   id: check-yaml
    -   id: debug-statements
    -   id: end-of-file-fixer
    -   id: no-commit-to-branch
        args: [--branch, main]
    -   id: trailing-whitespace

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.5.5
  hooks:
    - id: ruff
      args: [ --fix, --unsafe-fixes, --exit-non-zero-on-fix ]
    - id: ruff-format
      types_or: [ python, pyi ]  # notebooks are hand-formatted; keep ruff-format off them

- repo: https://github.com/MarcoGorelli/madforhooks
  rev: 0.4.1
  hooks:
    - id: no-print-statements
      files: ^ptgp/

- repo: local
  hooks:
    - id: pixi-lock-check
      name: pixi.lock is in sync with pyproject.toml
      entry: pixi lock --check
      language: system
      files: ^(pyproject\.toml|pixi\.lock)$
      pass_filenames: false

    - id: pixi-export-envs
      name: conda_envs/*.yaml are exported from the pixi environments
      # The script calls pixi directly rather than through a pixi task so the hook reads the manifest only; `pixi run`
      # would re-solve the lock file and install the environment first.
      entry: python scripts/export_conda_envs.py
      language: python
      files: ^(pyproject\.toml|pixi\.lock|conda_envs/.*\.yaml|scripts/export_conda_envs\.py)$
      pass_filenames: false

    - id: check-kernel-gallery
      name: check covariance gallery covers every public kernel
      entry: python scripts/check_kernel_gallery.py
      language: system
      pass_filenames: false
      files: ^(ptgp/kernels/|docs/sphinxext/generate_kernel_gallery\.py$)
