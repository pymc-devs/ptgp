name: pytest

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/*"
      - "ptgp/**"
      - "tests/**"
      - "pyproject.toml"
      - "conda_envs/**"

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  style:
    name: Run Pre-Commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # no-commit-to-branch would fail on direct pushes to main since HEAD is
      # main. CI isn't committing, just linting, so skip it.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: no-commit-to-branch

  test:
    name: ${{ matrix.name }}
    needs: style
    if: ${{ needs.style.result == 'success' }}
    strategy:
      matrix:
        include:
          - name: ubuntu / py3.13
            os: ubuntu-latest
            python-version: "3.13"
            shell: bash -leo pipefail {0}
          - name: windows / py3.12
            os: windows-latest
            python-version: "3.12"
            shell: cmd /C call {0}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: conda_envs/environment-test.yaml
          # gxx_win-64 16.2 is broken on conda-forge (ld cannot find dllcrt2.o), which
          # kills pytensor's C backend; hold the toolchain at 16.1 until fixed upstream.
          create-args: >-
            python=${{ matrix.python-version }}
            ${{ matrix.os == 'windows-latest' && 'gxx_win-64=16.1' || '' }}
          environment-name: ptgp-test
          init-shell: ${{ matrix.os == 'windows-latest' && 'cmd.exe' || 'bash' }}
          cache-environment: true
          post-cleanup: none
      - name: Install ptgp
        run: |
          pip install -e . --no-deps
          python --version
      - name: Run tests
        run: |
          python -m pytest --color=yes -vv --durations=50 tests/
